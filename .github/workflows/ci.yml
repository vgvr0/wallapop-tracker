name: CI

permissions:
  contents: read

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wallapop
          POSTGRES_USER: wallapop
          POSTGRES_PASSWORD: wallapop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallapop -d wallapop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        env:
          WALLAPOP_TRACKER_DB_URL: postgresql+psycopg://wallapop:wallapop@localhost:5432/wallapop
          WALLAPOP_TRACKER_TEST_POSTGRES_URL: postgresql+psycopg://wallapop:wallapop@localhost:5432/wallapop
        run: alembic upgrade head && pytest -m 'not postgres' && pytest -m postgres

      - name: Docker build
        run: docker build .
