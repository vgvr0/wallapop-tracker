[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallapop-profile-tracker"
version = "1.0.0"
description = "Read-only Wallapop monitoring, historical analytics and deal intelligence toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["wallapop", "monitoring", "analytics", "alerts", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]
release = [
  "build>=1.2",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/vgvr0/wallapop-tracker"
Repository = "https://github.com/vgvr0/wallapop-tracker"
Issues = "https://github.com/vgvr0/wallapop-tracker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wallapop_tracker"]

[tool.hatch.build.targets.sdist]
include = [
  "src/wallapop_tracker",
  "README.md",
  "pyproject.toml",
  "docs/releasing.md",
  "scripts/build_release.py",
  "scripts/validate_installed_package.py",
]

[project.scripts]
wallapop-track = "wallapop_tracker.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: explicitly authorized live Wallapop integration test",
  "postgres: integration tests requiring a real PostgreSQL database",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/wallapop_tracker/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
